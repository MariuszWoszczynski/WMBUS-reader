dashboard_import:
  package_import_url: github://MariuszWoszczynski/WMBUS-reader/WMBUS-reader-v6.yaml@main
  import_full_config: true
  
substitutions:
  name: "wmbus-reader-v6"
  friendly_name: "WMBUS Reader V6"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: esphome.wmbus_reader
    version: "1.0"

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

api:
  encryption:
    key: "vv9K2iu6uIBegfW1tLKSsIQcV10A674edhSNPv5d+lo="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: WMBUS Reader V6 Fallback Hotspot
#  static IP configuration (instead of data from the secret file)
#  manual_ip:
#    static_ip: 192.168.10.99
#    gateway: 192.168.10.1
#    subnet: 255.255.255.0

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/IoTLabs-pl/esphome-components
      ref: master
    refresh: 0s
    
mdns:
  disabled: false
  
time:
 - platform: sntp
   id: time_sntp

# Enable logging
logger:
  level: DEBUG

#your mqtt parameters
#mqtt:
#  broker: 10.10.10.10  
#  port: 1883
#  username: username 
#  password: password 

web_server: 
  port: 80
  version: 3

output:
  - platform: gpio
    id: status_led
    pin:
      number: GPIO02
      ignore_strapping_warning: true    

spi:
  clk_pin: GPIO33
  mosi_pin: GPIO32
  miso_pin: GPIO19


  
wmbus_radio:
  radio_type: SX1262
  cs_pin: GPIO23
  reset_pin: GPIO22  
  dio1_pin: GPIO21  
  busy_pin: GPIO18
  tcxo_voltage: 1.8V
  rf_switch: true
  on_frame:
    - then:
        - logger.log:
            format: "RSSI: %ddBm T: %s (%d)"
            args: [ frame->rssi(), frame->as_hex().c_str(), frame->data().size() ]
    - then:
        - repeat:
            count: 1
            then:
              - output.turn_on: status_led
              - delay: 100ms
              - output.turn_off: status_led
              - delay: 100ms


##############################################################################################################################################################################
##############################################################################################################################################################################
# The following sensors are examples, for IZAR, APATOR, UNISMART, Heat and Electricity meters. Leave only the configuration of such meters you have, delete the other sensors. 
# If you have another meter, check its configuration on:  https://github.com/SzczepanLeon/esphome-components and https://github.com/IoTLabs-pl/esphome-components
##############################################################################################################################################################################
#############################################################################################################################################################################
############################# Define counters here (typ, ID, key, mode...) ###############################
wmbus_meter:
  - id: water_meter_izar
    meter_id: "414FDFAC"  ######## enter your IZAR meter ID here ###########
    type: izarv2
  - id: water_meter_apator
    meter_id: "07208205"  ######## enter your APATOR meter ID here ###########
    type: apator162
    key: "00000000000000000000000000000000"
  - id: gas_meter_unismart
    meter_id: "00062651"  ######## enter your UNISMART meter ID here ###########
    type: unismart
    key: "00000000000000000000000000000000"


########################### Define sensors here #####################################
sensor:
  - platform: wmbus_meter 
    parent_id: water_meter_izar  #Water meter Izar
    field: total_m3
    device_class: water
    name: Izar water meter - state
    accuracy_decimals: 2
    state_class: total_increasing
    unit_of_measurement: "m³"
  - platform: wmbus_meter
    parent_id: water_meter_izar
    field: rssi_dbm
    name: Izar water meter - RSSI
    unit_of_measurement: "dBm"

  - platform: wmbus_meter
    parent_id: water_meter_apator #Water meter Apator
    field: total_m3
    device_class: water
    name: Apator water meter - state
    accuracy_decimals: 2
    state_class: total_increasing
    unit_of_measurement: "m³"
  - platform: wmbus_meter
    parent_id: water_meter_apator
    field: rssi_dbm
    name: Apator water meter - RSSI
    unit_of_measurement: "dBm"

  - platform: wmbus_meter
    parent_id: gas_meter_unismart #Water meter Unismart
    field: total_m3
    device_class: water
    name: Unismart gas meter - state
    accuracy_decimals: 2
    state_class: total_increasing
    unit_of_measurement: "m³"
    filters:           
      - offset: 991.10   
  - platform: wmbus_meter
    parent_id: gas_meter_unismart
    field: rssi_dbm
    name: RSSI licznika gazu Unismart V5
    unit_of_measurement: "dBm"
